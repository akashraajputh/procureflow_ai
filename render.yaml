services:
  - type: web
    name: corvo-procurement-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: corvo-procurement-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/procurement.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@corvo.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://corvo-procurement-web.onrender.com

  - type: web
    name: corvo-procurement-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://corvo-procurement-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
